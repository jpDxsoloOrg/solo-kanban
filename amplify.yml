version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - npx prisma generate
        - npx prisma migrate deploy
    build:
      commands:
        - env | grep -E '^(DATABASE_URL|DIRECT_DATABASE_URL|API_KEYS)' | sed 's/=.*/=****/' || true
        - echo "DATABASE_URL=$DATABASE_URL" > .env.production
        - echo "API_KEYS=$API_KEYS" >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
